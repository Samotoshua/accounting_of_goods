<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакції</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Система управління складом</h1>

        <ul class="nav nav-pills mb-4">
            <li class="nav-item">
                <a class="nav-link" href="/">Товари</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/warehouses">Склади</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/transactions">Транзакції</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/balances">Облік залишків</a>
            </li>
        </ul>

        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h3>Надходження (Додати товар)</h3>
                    </div>
                    <div class="card-body">
                        <form action="/receive_product" method="post">
                            <div class="mb-3">
                                <label class="form-label">Товар:</label>
                                <select class="form-select" name="product_id" required>
                                    {% for p in products %}
                                    <option value="{{ p.id }}">{{ p.name }} ({{ p.article_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Склад:</label>
                                <select class="form-select" name="warehouse_id" required>
                                    {% for w in warehouses %}
                                    <option value="{{ w.id }}">{{ w.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Кількість:</label>
                                <input type="number" class="form-control" name="quantity" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-success">Додати надходження</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header bg-danger text-white">
                        <h3>Розхід (Продати товар)</h3>
                    </div>
                    <div class="card-body">
                        <form action="/sell_product" method="post">
                            <div class="mb-3">
                                <label class="form-label">Товар:</label>
                                <select class="form-select" name="product_id" required>
                                    {% for p in products %}
                                    <option value="{{ p.id }}">{{ p.name }} ({{ p.article_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Склад:</label>
                                <select class="form-select" name="warehouse_id" required>
                                    {% for w in warehouses %}
                                    <option value="{{ w.id }}">{{ w.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Кількість:</label>
                                <input type="number" class="form-control" name="quantity" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-danger">Продати</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h3>Внутрішнє переміщення</h3>
                    </div>
                    <div class="card-body">
                        <form action="/move_product" method="post">
                            <div class="mb-3">
                                <label class="form-label">Товар:</label>
                                <select class="form-select" name="product_id" required>
                                    {% for p in products %}
                                    <option value="{{ p.id }}">{{ p.name }} ({{ p.article_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Склад ВІД:</label>
                                <select class="form-select" name="from_warehouse_id" required>
                                    {% for w in warehouses %}
                                    <option value="{{ w.id }}">{{ w.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Склад КУДИ:</label>
                                <select class="form-select" name="to_warehouse_id" required>
                                    {% for w in warehouses %}
                                    <option value="{{ w.id }}">{{ w.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Кількість:</label>
                                <input type="number" class="form-control" name="quantity" min="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Перемістити</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування товару</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Система управління складом</h1>

        <ul class="nav nav-pills mb-4">
            <li class="nav-item">
                <a class="nav-link active" href="/">Товари</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/warehouses">Склади</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/transactions">Транзакції</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/balances">Облік залишків</a>
            </li>
        </ul>

        <div class="card">
            <div class="card-header">
                <h3>Редагувати товар #{{ product.id }}</h3>
            </div>
            <div class="card-body">
                {% if product %}
                <form action="/update_product/{{ product.id }}" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Назва товару</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="article_number" class="form-label">Артикул (Номер)</label>
                        <input type="text" class="form-control" id="article_number" name="article_number" value="{{ product.article_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Ціна</label>
                        <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                    </div>
                    <button type="submit" class="btn btn-success">Зберегти зміни</button>
                    <a href="/" class="btn btn-secondary">Скасувати</a>
                </form>
                {% else %}
                <p>Товар не знайдено!</p>
                <a href="/" class="btn btn-secondary">Назад до товарів</a>
                {% endif %}
            </div>
        </div>

    </div>
</body>
</html>
